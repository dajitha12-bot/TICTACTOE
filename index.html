<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotton Candy Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cotton Candy Tic Tac Toe</h1>
        <div class="subtitle">The sweetest game in town!</div>
        
        <div class="game-info">
            <div class="player-info active" id="player1-info">
                <div class="player-name">Player 1</div>
                <div class="player-symbol">X</div>
                <div class="score">Score: <span id="player1-score">0</span></div>
            </div>
            <div class="player-info" id="player2-info">
                <div class="player-name">Player 2</div>
                <div class="player-symbol">O</div>
                <div class="score">Score: <span id="player2-score">0</span></div>
            </div>
        </div>
        
        <div class="game-board" id="game-board">
            <!-- Cells will be generated by JavaScript -->
        </div>
        
        <div class="message" id="message">Player 1's turn!</div>
        
        <div class="controls">
            <button id="restart-btn">New Game</button>
            <button id="reset-score-btn">Reset Score</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
